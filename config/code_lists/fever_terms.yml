    "missing_sentinel_values": [-9],
    "confirmed_labels": {"-9": "Blank", "998": "99.8", "999": "99.9", "1004": "100.4"},
    "review_status": "confirmed_codebook"
  },
  "patterns": [
    {"rule_id": "fever_text", "regex": "\\bfever\\b", "normalized_value": "fever_text", "use": "sensitivity_only", "review_status": "TODO-confirm-source"},
    {"rule_id": "febrile_text", "regex": "\\bfebrile\\b", "normalized_value": "fever_text", "use": "sensitivity_only", "review_status": "TODO-confirm-source"},
    {"rule_id": "chills_text", "regex": "\\bchills\\b|\\brigor(?:s)?\\b", "normalized_value": "fever_text", "use": "sensitivity_only", "review_status": "sensitivity_only"}
  ],
  "notes": "Objective temperature is primary for NHAMCS pooled promotion review. Text terms remain sensitivity-only and do not block objective fever promotion."
}
